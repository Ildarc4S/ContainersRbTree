name: CI for C++ Containers

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "develop" ]

env:
  BUILD_TYPE: Debug

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_dir: ${{ steps.set_build_dir.outputs.path }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Set build directory
      id: set_build_dir
      run: echo "path=${{ github.workspace }}/build_${{ github.run_id }}" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 18
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          valgrind \
          clang-format-18 \
          clang-tidy-18 \
          cppcheck \
          libgtest-dev \
          lcov \
          gcovr \
          ccache
        sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
        sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

  build:
    needs: setup
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ needs.setup.outputs.build_dir }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure
      run: cmake -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      run: cmake --build "$BUILD_DIR" --parallel $(nproc)

  analysis:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ needs.setup.outputs.build_dir }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Run clang-format
      run: cmake --build "$BUILD_DIR" --target clang-format-test

    - name: Run cppcheck
      run: cmake --build "$BUILD_DIR" --target cppcheck-test

    - name: Run clang-tidy
      run: cmake --build "$BUILD_DIR" --target clang-tidy-test

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ needs.setup.outputs.build_dir }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Run tests
      run: |
        if [ -d "$BUILD_DIR" ]; then
          cd "$BUILD_DIR"
          ctest --output-on-failure --parallel $(nproc)
        else
          echo "Error: Build directory $BUILD_DIR does not exist"
          exit 1
        fi

    - name: Valgrind check
      run: |
        if [ -d "$BUILD_DIR" ]; then
          cmake --build "$BUILD_DIR" --target valgrind-test
        else
          echo "Error: Build directory $BUILD_DIR does not exist"
          exit 1
        fi

  coverage:
    needs: test
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ needs.setup.outputs.build_dir }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate coverage
      run: |
        if [ -d "$BUILD_DIR" ]; then
          cmake --build "$BUILD_DIR" --target coverage
          bash <(curl -s https://codecov.io/bash)
        else
          echo "Error: Build directory $BUILD_DIR does not exist"
          exit 1
        fi
