name: CI for C++ Containers

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "develop" ]

env:
  BUILD_TYPE: Debug
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 18
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          valgrind \
          clang-format-18 \
          clang-tidy-18 \
          cppcheck \
          libgtest-dev \
          lcov \
          gcovr \
          ccache
        sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
        sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

    - name: Configure project
      run: |
        mkdir -p "$BUILD_DIR"
        cmake -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build project
      run: cmake --build "$BUILD_DIR" --parallel $(nproc)

  static-analysis:
    needs: setup-and-build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Reconfigure (force fresh cache)
      run: cmake -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Run clang-format check
      run: cmake --build "$BUILD_DIR" --target clang-format-test

    - name: Run cppcheck
      run: cmake --build "$BUILD_DIR" --target cppcheck-test

    - name: Run clang-tidy
      run: cmake --build "$BUILD_DIR" --target clang-tidy-test

  testing:
    needs: setup-and-build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run tests
      run: |
        cd "$BUILD_DIR"
        ctest --output-on-failure --parallel $(nproc)

    - name: Run valgrind check
      run: cmake --build "$BUILD_DIR" --target valgrind-test

  coverage:
    needs: testing
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Generate coverage
      run: |
        cmake --build "$BUILD_DIR" --target coverage
        bash <(curl -s https://codecov.io/bash)
