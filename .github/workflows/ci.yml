name: CI for C++ Containers

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop

env:
  BUILD_TYPE: Debug
  BUILD_DIR: build

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create build directory
      run: mkdir -p build

    - name: Configure project
      working-directory: build
      run: cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build project
      working-directory: build
      run: cmake --build . --parallel $(nproc)

  static-analysis:
    needs: setup-and-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run clang-format check
      working-directory: build
      run: cmake --build . --target clang-format-test

    - name: Run cppcheck
      working-directory: build
      run: cmake --build . --target cppcheck-test

    - name: Run clang-tidy
      working-directory: build
      run: cmake --build . --target clang-tidy-test
