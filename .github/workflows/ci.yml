name: Cleanup deployments, build coverage and auto-merge

on:
  push:
    branches:
      - 'develop'
      - 'rb_tree'
  pull_request:
    branches:
      - '*'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Delete Deployment Environment
        uses: strumwolf/delete-deployment-environment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: github-pages
          onlyRemoveDeployments: true

  test:
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.test_status.outputs.success }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/docker/Dockerfile
          load: true
          tags: s21containers
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Run build and tests
        id: run_tests
        run: |
          cd src
          make build
          make test
          echo "Tests completed successfully"

      - name: Run coverage
        run: cd src && make coverage

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/build/coverage

      - name: Deploy coverage report to GitHub Pages
        if: github.ref == 'refs/heads/rb_tree' || github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/build/coverage

      - name: Set test status
        id: test_status
        run: echo "success=true" >> $GITHUB_OUTPUT

  create-and-merge-pr:
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.result == 'success' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/rb_tree')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          title: "✅ Auto-merge: ${{ github.ref_name }} → main"
          body: |
            ## Автоматический Pull Request
            
            ✅ **Все тесты успешно пройдены!**
            
            **Детали:**
            - Ветка источника: `${{ github.ref_name }}`
            - Ветка назначения: `main`
            - Commit: ${{ github.sha }}
            - Coverage report: доступен в артефактах workflow
            
            Этот PR будет автоматически смержен после проверки.
          base: main
          head: ${{ github.ref_name }}
          labels: auto-merge,automated-pr,ci-approved
          assignees: ${{ github.actor }}
          draft: false

      - name: Auto-merge PR
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: merge
