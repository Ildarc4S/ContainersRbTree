name: CI for containers

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_dir: ${{ github.workspace }}/build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          valgrind \
          clang-format \
          clang-tidy \
          cppcheck \
          libgtest-dev

    - name: Configure and build
      run: |
        mkdir -p build
        cd build
        cmake ..
        cmake --build . --parallel

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-dir
        path: build
        retention-days: 1

  analysis:
    needs: setup
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-dir
        path: build

    - name: Run clang-format test
      working-directory: build
      run: cmake --build . --target clang-format-test
    
    - name: Run cppcheck
      working-directory: build
      run: cmake --build . --target cppcheck-test

    - name: Run clang-tidy
      working-directory: build
      run: cmake --build . --target clang-tidy-test

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-dir
        path: build

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure --parallel

    - name: Run valgrind tests
      working-directory: build
      run: cmake --build . --target valgrind-test
